<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>題庫測驗．Python 程式理解</title>
<meta name="description" content="Python 程式理解測驗題庫練習（單選 100＋複選 20）">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ============ 設計變數 Design Tokens ============ */
:root{
  --paper:#EDE7D6; --paper-alt:#E4DDC8; --card:#F8F4E8;
  --ink:#22302B; --ink-soft:#5C6660; --line:#CFC6A9;
  --brass:#8E7B45; --stamp:#A23B2E;
  --correct:#4C6B47; --incorrect:#A23B2E;
  --correct-bg:#E3EAE0; --incorrect-bg:#F1E1DB;
  --radius:4px;
  --shadow:0 1px 2px rgba(34,42,36,.08),0 3px 10px rgba(34,42,36,.06);
  --font-display:'Noto Serif TC',serif;
  --font-body:'Noto Sans TC',sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
}
[data-theme="dark"]{
  --paper:#1B1D1A; --paper-alt:#202320; --card:#242621;
  --ink:#E9E4D3; --ink-soft:#A9A392; --line:#3A3B33;
  --brass:#C2AA66; --stamp:#C4584A;
  --correct:#86A876; --incorrect:#C4584A;
  --correct-bg:#26301F; --incorrect-bg:#32211C;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 4px 14px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink); font-family:var(--font-body);
  font-size:16px; line-height:1.65; -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  transition:background-color .25s ease,color .25s ease;
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
}
button{touch-action:manipulation; font-family:inherit}
.app-shell{max-width:900px;margin:0 auto;padding:22px 20px 72px}

/* ============ Header ============ */
.site-header,.quiz-header{
  display:flex;align-items:flex-start;justify-content:space-between;gap:14px;
  padding:6px 0 24px;border-bottom:1px solid var(--line);margin-bottom:26px;
}
.brand{display:flex;align-items:center;gap:13px;min-width:0}
.brand-mark{
  width:44px;height:44px;border-radius:50%;border:2px solid var(--brass);color:var(--brass);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  font-family:var(--font-display);font-size:19px;font-weight:600;
}
.site-header h1,.quiz-title h1{
  font-family:var(--font-display);font-weight:700;font-size:21px;margin:0 0 3px;
  letter-spacing:.02em; overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.tagline,.quiz-meta{
  font-family:var(--font-mono);font-size:12px;color:var(--ink-soft);margin:0;letter-spacing:.03em;
}
.quiz-title{min-width:0;flex:1}
.toolbar{display:flex;gap:7px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
.icon-btn{
  width:38px;height:38px;border-radius:50%;border:1px solid var(--line);
  background:var(--card);color:var(--ink);display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:background-color .15s,transform .15s,border-color .15s;position:relative;
}
.icon-btn:hover{border-color:var(--brass)}
.icon-btn:active{transform:scale(.92)}
.icon-btn.is-active{background:var(--brass);border-color:var(--brass);color:var(--paper)}
.icon-btn svg{width:17px;height:17px}
button:focus-visible,.link-btn:focus-visible{outline:2px solid var(--stamp);outline-offset:2px}
.link-btn{
  background:none;border:none;color:var(--ink-soft);font-size:13.5px;cursor:pointer;
  padding:8px 4px;text-decoration:underline;text-underline-offset:3px;white-space:nowrap;
}
.link-btn:hover{color:var(--ink)}

/* ============ Catalog (home) ============ */
.catalog-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.bank-card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:19px 18px;display:flex;flex-direction:column;gap:7px;box-shadow:var(--shadow);
  position:relative; animation:fadeIn .3s ease backwards;
}
.bank-card::before{
  content:'';position:absolute;left:0;top:14px;bottom:14px;width:3px;
  background:var(--brass);border-radius:0 2px 2px 0;
}
.bank-card-code{font-family:var(--font-mono);font-size:11px;color:var(--brass);letter-spacing:.08em}
.bank-card-title{font-family:var(--font-display);font-size:17px;font-weight:600;margin:0;line-height:1.4}
.bank-card-meta{font-size:12.5px;color:var(--ink-soft);margin:0}
.bank-card-footer{margin-top:auto;padding-top:13px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.bank-card-count{font-family:var(--font-mono);font-size:12.5px;color:var(--ink-soft)}
.bank-card-btns{display:flex;align-items:center;gap:12px}
.btn-text{background:none;border:none;font-size:12.5px;color:var(--ink-soft);cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:4px 0}
.btn-text:hover{color:var(--stamp)}
.bank-card-empty{border-style:dashed;align-items:center;justify-content:center;text-align:center;color:var(--ink-soft);box-shadow:none;background:transparent}
.bank-card-empty::before{display:none}
.catalog-note{font-family:var(--font-mono);font-size:12px;color:var(--ink-soft);margin:0 0 16px}

.btn-primary{
  font-weight:600;font-size:13.5px;background:var(--ink);color:var(--paper);border:none;
  border-radius:var(--radius);padding:9px 15px;cursor:pointer;
  transition:transform .15s,background-color .15s;white-space:nowrap;
}
.btn-primary:hover{background:var(--stamp)}
.btn-primary:active{transform:scale(.97)}
.btn-ghost{
  font-weight:600;font-size:13.5px;background:transparent;color:var(--ink);border:1px solid var(--line);
  border-radius:var(--radius);padding:9px 15px;cursor:pointer;
  transition:border-color .15s,background-color .15s;
}
.btn-ghost:hover{border-color:var(--brass);background:var(--card)}
.btn-ghost:disabled,.btn-primary:disabled{opacity:.4;cursor:not-allowed}
.btn-ghost.is-active{border-color:var(--brass);background:var(--card);color:var(--brass)}

/* ============ progress ============ */
.progress-bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:24px}
.progress-fill{height:100%;background:var(--brass);transition:width .3s ease}

/* ============ mode toolbar (shuffle etc) ============ */
.mode-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.mode-btn{
  display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;
  background:var(--card);color:var(--ink-soft);border:1px solid var(--line);border-radius:20px;
  padding:7px 13px;cursor:pointer;transition:all .15s;
}
.mode-btn:hover{border-color:var(--brass)}
.mode-btn.is-active{background:var(--brass);border-color:var(--brass);color:var(--paper)}
.mode-btn svg{width:13px;height:13px}

/* ============ question card ============ */
.question-card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:26px 24px;box-shadow:var(--shadow);margin-bottom:20px;animation:fadeIn .25s ease;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.question-num{font-family:var(--font-mono);font-size:12.5px;color:var(--brass);letter-spacing:.1em;margin-bottom:10px}
.question-text{font-size:18.5px;line-height:1.7;margin:0 0 20px;font-weight:500}
.options{display:flex;flex-direction:column;gap:9px}
.option{
  display:flex;align-items:center;gap:12px;text-align:left;width:100%;
  padding:12px 15px;border:1px solid var(--line);border-radius:var(--radius);
  background:var(--paper);cursor:pointer;font-size:15px;color:var(--ink);line-height:1.5;
  transition:border-color .15s,background-color .15s;
}
.option:hover:not(:disabled){border-color:var(--brass)}
.option:disabled{cursor:default;opacity:1}
.bubble{font-size:16px;width:18px;flex-shrink:0;text-align:center;color:var(--ink-soft)}
.option-letter{font-family:var(--font-mono);font-weight:600;color:var(--ink-soft);flex-shrink:0;font-size:14px}
.option-text{flex:1}
.tag{font-family:var(--font-mono);font-size:10.5px;padding:3px 8px;border-radius:10px;flex-shrink:0;white-space:nowrap}
.option.is-correct{border-color:var(--correct);background:var(--correct-bg)}
.option.is-correct .bubble{color:var(--correct)}
.option.is-correct .tag{background:var(--correct);color:var(--paper)}
.option.is-incorrect{border-color:var(--incorrect);background:var(--incorrect-bg)}
.option.is-incorrect .bubble{color:var(--incorrect)}
.option.is-incorrect .tag{background:var(--incorrect);color:var(--paper)}
.option.is-dim{opacity:.55}

.quiz-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px;gap:10px}

.grid-nav h2{
  font-family:var(--font-mono);font-size:12px;text-transform:uppercase;letter-spacing:.1em;
  color:var(--ink-soft);font-weight:600;margin:0 0 12px;
}
.grid-nav-cells{display:flex;flex-wrap:wrap;gap:7px}
.cell{
  width:33px;height:33px;border-radius:50%;border:1px solid var(--line);background:var(--card);
  font-family:var(--font-mono);font-size:11.5px;color:var(--ink-soft);cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:all .15s;
}
.cell:hover{border-color:var(--brass)}
.cell.is-current{border-color:var(--ink);border-width:2px;color:var(--ink);font-weight:700}
.cell.is-correct{background:var(--correct);border-color:var(--correct);color:var(--paper)}
.cell.is-incorrect{background:var(--incorrect);border-color:var(--incorrect);color:var(--paper)}

/* ============ results ============ */
.results-main{display:flex;flex-direction:column;align-items:center;text-align:center;gap:26px}
.score-stamp{display:flex;flex-direction:column;align-items:center;gap:6px;margin:10px 0 6px}
.score-stamp-ring{
  width:132px;height:132px;border-radius:50%;border:3px double var(--stamp);color:var(--stamp);
  display:flex;align-items:baseline;justify-content:center;transform:rotate(-5deg);font-family:var(--font-display);
}
.score-num{font-size:42px;font-weight:700}
.score-slash{font-size:20px;margin:0 3px;opacity:.6}
.score-total{font-size:20px;opacity:.8}
.score-pct{font-family:var(--font-mono);color:var(--ink-soft);font-size:13.5px;letter-spacing:.05em}
.results-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.review{text-align:left;width:100%;margin-top:6px}
.review h2{font-family:var(--font-display);font-size:16.5px;margin:0 0 13px}
.review-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:13px}
.review-list li{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:15px 17px}
.review-q{font-weight:600;margin:0 0 8px;font-size:14.5px}
.review-a{margin:0 0 4px;font-size:13.5px;color:var(--incorrect)}
.review-correct{margin:0;font-size:13.5px;color:var(--correct)}
.all-correct{font-family:var(--font-display);font-size:17px;color:var(--correct)}

@media (max-width:560px){
  .quiz-title h1,.site-header h1{font-size:17px}
  .question-text{font-size:16.5px}
  .catalog-grid{grid-template-columns:1fr}
  .cell{width:29px;height:29px}
  .app-shell{padding:16px 14px 60px}
  .quiz-header,.site-header{gap:10px}
}

/* ============ Python 題庫：程式碼、複選、解析 ============ */
.q-tags{margin-left:12px;color:var(--ink-soft);font-size:11.5px;letter-spacing:.04em}
.q-tag-multi{display:inline-block;background:var(--stamp);color:var(--paper);padding:1px 9px;border-radius:10px;margin-right:8px;font-weight:600;letter-spacing:.06em}
.code-block{
  margin:0 0 20px;padding:14px 16px;background:var(--paper);border:1px solid var(--line);
  border-left:3px solid var(--brass);border-radius:var(--radius);font-family:var(--font-mono);
  font-size:14.5px;line-height:1.65;overflow-x:auto;tab-size:4;
}
.code-block code{font-family:inherit;white-space:pre}
.code-block-sm{margin:8px 0 10px;font-size:13px;padding:10px 12px}
.option-text{white-space:pre-line;min-width:0;overflow-wrap:anywhere}
.option.is-mono .option-text{font-family:var(--font-mono);font-size:14px}
.option.is-picked{border-color:var(--brass);background:var(--card)}
.multi-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:16px}
.multi-hint{font-size:12.5px;color:var(--ink-soft)}
.explain{
  margin-top:18px;padding:13px 16px;border-left:3px solid var(--brass);background:var(--paper);
  border-radius:0 var(--radius) var(--radius) 0;animation:fadeIn .25s ease;
}
.explain-label{display:block;font-family:var(--font-mono);font-size:11px;color:var(--brass);letter-spacing:.1em;margin-bottom:4px}
.explain p{margin:0;font-size:14.5px;line-height:1.7}
.cell.is-pending{border-style:dashed;border-color:var(--brass)}
.review-a,.review-correct{white-space:pre-line}
.review-expl{margin:5px 0 0;font-size:13.5px;line-height:1.7;color:var(--ink-soft)}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';

/* ============ 題庫資料 DATA ============ */
/* 要新增題庫時：把新的題庫物件加進這個陣列即可（格式同下）。*/

式執行後的輸出為何？", "options": ["[1, 2] [9, 2]", "[1, 2] [1, 2]", "[9, 2] [9, 2]", "[9, 2] [1, 2]"], "a": 0, "code": "a = [1, 2]\nb = a[:]\nb[0] = 9\nprint(a, b)", "mono": true, "cat": "輸出預測／變數追蹤", "diff": "中", "expl": "切片建立新的外層串列，修改 b 的整數元素不影響 a。"}, {"q": "程式執行後的輸出為何？", "options": ["[2] [0]", "[0] [0]", "[2, 5] [0]", "[2, 5] [2, 5]"], "a": 2, "code": "def change(xs):\n    xs.append(5)\n    xs = [0]\n    return xs\na = [2]\nb = change(a)\nprint(a, b)", "mono": true, "cat": "輸出預測／函數", "diff": "中", "expl": "append 修改傳入物件；其後 xs 的重新指派只改變區域綁定。"}, {"q": "程式執行後的輸出為何？", "options": ["True True", "False False", "False True", "True False"], "a": 2, "code": "x = 5\ny = 0\nprint(x > 3 and y != 0, x > 3 or y != 0)", "mono": true, "cat": "輸出預測／選擇決策", "diff": "中", "expl": "and 需兩邊皆真；or 只需一邊為真。"}, {"q": "程式執行後的輸出為何？", "options": ["yt nohtyP", "yh nohtyP", "yh Python", "Pt nohtyP"], "a": 1, "code": "s = \"Python\"\nprint(s[1:5:2], s[::-1])", "mono": true, "cat": "輸出預測／變數追蹤", "diff": "中", "expl": "索引 1、3 形成 yh；步長 -1 產生反向字串。"}, {"q": "程式執行後的輸出為何？", "options": ["3 3", "2 1", "1 2", "2 2"], "a": 1, "code": "class Counter:\n    def __init__(self):\n        self.n = 0\n    def step(self):\n        self.n += 1\na = Counter()\nb = Counter()\na.step()\na.step()\nb.step()\nprint(a.n, b.n)", "mono": true, "cat": "輸出預測／物件導向", "diff": "中", "expl": "每個實例各有自己的 n；a 更新兩次，b 更新一次。"}, {"q": "程式執行後的輸出為何？", "options": ["20 30 30", "20 20 20", "30 30 30", "20 20 30"], "a": 0, "code": "class Course:\n    seats = 30\na = Course()\nb = Course()\na.seats = 20\nprint(a.seats, b.seats, Course.seats)", "mono": true, "cat": "輸出預測／物件導向", "diff": "中", "expl": "a.seats 的指派建立實例屬性，遮蔽類別屬性；b 仍讀取類別的 30。"}, {"q": "程式執行後的輸出為何？", "options": ["40", "10", "50", "60"], "a": 0, "code": "class Base:\n    def fee(self):\n        return 50\nclass Member(Base):\n    def fee(self):\n        return super().fee() - 10\nprint(Member().fee())", "mono": true, "cat": "輸出預測／物件導向", "diff": "中", "expl": "super().fee() 取得父類別的 50，再扣除 10。"}, {"q": "程式執 const ICON_LIST = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>';
const ICON_RESTART = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>';

/* ============ STATE ============ */
const root = document.getElementById('app');
let currentTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
document.documentElement.setAttribute('data-theme', currentTheme);

let state = { view: 'home' };
// quiz state shape when view==='quiz'||'results':
// { view, bankId, order:[qIdx...], idx, answers:{qIdx: displayPos | [displayPos...]}, pending:{qIdx:[displayPos...]},
//   wrongOnly, shuffleQ, shuffleO, qOptOrder:{qIdx:[origIdx x N]} }
// answers：單選 = 作答的顯示位置；複選 = 按下「確認答案」後鎖定的顯示位置陣列
// pending：複選題尚未確認的暫選位置

/* ============ UTILITIES ============ */
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function shuffleArray(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function getBank(id){ return QUESTION_BANKS.find(b => b.id === id); }
function getCurrentBank(){ return getBank(state.bankId); }
function answerSet(q){ return Array.isArray(q.a) ? q.a : [q.a]; }
function isMulti(q){ return q.multi === true; }
function isCorrectPos(q, optOrder, pos){ return answerSet(q).includes(optOrder[pos]); }
function isAnswered(qi){ return state.answers[qi] != null; }
function chosenPositions(qi){
  const a = state.answers[qi];
  return a == null ? [] : (Array.isArray(a) ? a : [a]);
}
// 單選：選到任一標準答案即對；複選：必須「全選對、不多選」才算對
function isCorrectAns(bank, qi){
  const q = bank.questions[qi];
  if (!isAnswered(qi)) return false;
  const optOrder = state.qOptOrder[qi];
  if (isMulti(q)){
    const chosen = chosenPositions(qi).map(p => optOrder[p]).sort((x, y) => x - y);
    const need = answerSet(q).slice().sort((x, y) => x - y);
    return chosen.length === need.length && chosen.every((v, i) => v === need[i]);
  }
  return isCorrectPos(q, optOrder, state.answers[qi]);
}
// 作答到一半（有作答、但還沒全部答完）時，會讓進度消失的動作要先確認
function hasPartialProgress(){
  if (!state.order) return false;
  const n = state.order.filter(isAnswered).length;
  return n > 0 && n < state.order.length;
}
function confirmDiscard(){
  return !hasPartialProgress() || window.confirm('目前的作答進度會被清除，確定要繼續嗎？');
}

/* ============ ACTIONS ============ */
function goHome(){ state = { view: 'home' }; render(); }

function freshOptOrder(q, shuffleO){
  const base = q.options.map((_, i) => i);
  return shuffleO ? shuffleArray(base) : base;
}
function buildOrder(bank, indices, shuffleQ, shuffleO){
  const order = shuffleQ ? shuffleArray(indices) : indices.slice();
  const qOptOrder = {};
  order.forEach(qi => { qOptOrder[qi] = freshOptOrder(bank.questions[qi], shuffleO); });
  return { order, qOptOrder };
}

function startQuiz(bankId, opts){
  opts = opts || {};
  const bank = getBank(bankId);
  if (!bank) return;
  const shuffleQ = !!opts.shuffleQ, shuffleO = !!opts.shuffleO;
  const indices = bank.questions.map((_, i) => i);
  const { order, qOptOrder } = buildOrder(bank, indices, shuffleQ, shuffleO);
  state = { view:'quiz', bankId, order, idx:0, answers:{}, pending:{}, wrongOnly:false, shuffleQ, shuffleO, qOptOrder };
  render();
}

// 「隨機出題」：不重置進度。已作答的題目與目前這題留在原位，只重排其餘「尚未作答」的題目；關閉時這些題目回到原本題號順序。
function toggleShuffleQ(){
  const next = !state.shuffleQ;
  const slots = [], pool = [];
  state.order.forEach((qi, pos) => {
    if (!isAnswered(qi) && pos !== state.idx){ slots.push(pos); pool.push(qi); }
  });
  const arranged = next ? shuffleArray(pool) : pool.slice().sort((a, b) => a - b);
  slots.forEach((pos, i) => { state.order[pos] = arranged[i]; });
  state.shuffleQ = next;
  render();
}
// 「選項打亂」：不重置進度。已作答的題目選項順序不變，只有尚未作答的題目會重新排列（複選的暫選項目一併換算到新位置）。
function toggleShuffleO(){
  const bank = getCurrentBank();
  const next = !state.shuffleO;
  state.order.forEach(qi => {
    if (isAnswered(qi)) return;
    const oldOrder = state.qOptOrder[qi];
    const newOrder = freshOptOrder(bank.questions[qi], next);
    const sel = state.pending[qi];
    if (sel && sel.length) state.pending[qi] = sel.map(p => newOrder.indexOf(oldOrder[p])).sort((a, b) => a - b);
    state.qOptOrder[qi] = newOrder;
  });
  state.shuffleO = next;
  render();
}
function restartWithModes(modes){
  const bank = getCurrentBank();
  const baseIndices = state.wrongOnly ? state.order.slice().sort((a, b) => a - b) : bank.questions.map((_,i)=>i);
  const { order, qOptOrder } = buildOrder(bank, baseIndices, modes.shuffleQ, modes.shuffleO);
  state = { view:'quiz', bankId: state.bankId, order, idx:0, answers:{}, pending:{}, wrongOnly: state.wrongOnly, shuffleQ: modes.shuffleQ, shuffleO: modes.shuffleO, qOptOrder };
  render();
}
function restartQuiz(){ restartWithModes({ shuffleQ: state.shuffleQ, shuffleO: state.shuffleO }); }

function retryWrong(){
  const bank = getCurrentBank();
  const wrongIndices = state.order.filter(qi => !isCorrectAns(bank, qi));
  if (!wrongIndices.length) return;
  const { order, qOptOrder } = buildOrder(bank, wrongIndices, false, state.shuffleO);
  state = { view:'quiz', bankId: state.bankId, order, idx:0, answers:{}, pending:{}, wrongOnly:true, shuffleQ:false, shuffleO: state.shuffleO, qOptOrder };
  render();
}

function selectOption(pos){
  const bank = getCurrentBank();
  const qIdx = state.order[state.idx];
  const q = bank.questions[qIdx];
  if (isAnswered(qIdx)) return;
  if (!(pos >= 0 && pos < state.qOptOrder[qIdx].length)) return;
  if (isMulti(q)){
    const cur = (state.pending[qIdx] || []).slice();
    const at = cur.indexOf(pos);
    if (at >= 0) cur.splice(at, 1); else cur.push(pos);
    state.pending[qIdx] = cur.sort((a, b) => a - b);
  } else {
    state.answers[qIdx] = pos;
  }
  render();
}
function confirmMulti(){
  const qIdx = state.order[state.idx];
  const sel = state.pending[qIdx];
  if (isAnswered(qIdx) || !sel || !sel.length) return;
  state.answers[qIdx] = sel.slice();
  delete state.pending[qIdx];
  render();
}
function goNext(){ if (state.idx < state.order.length - 1){ state.idx++; render(); } }
function goPrev(){ if (state.idx > 0){ state.idx--; render(); } }
function jumpTo(pos){ if (pos >= 0 && pos < state.order.length){ state.idx = pos; render(); } }
function finishQuiz(){ state.view = 'results'; render(); }
function resumeQuiz(){ state.view = 'quiz'; render(); }
function toggleTheme(){
  currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', currentTheme);
  render();
}

/* ============ RENDER ============ */
function themeBtn(){
  return `<button class="icon-btn" data-action="toggle-theme" title="切換深色／淺色模式" aria-label="切換深色／淺色模式">${currentTheme === 'dark' ? ICON_SUN : ICON_MOON}</button>`;
}

function renderHome(){
  const cards = QUESTION_BANKS.map((bank, i) => `
    <article class="bank-card" style="animation-delay:${Math.min(i,10)*30}ms">
      <div class="bank-card-code">代號 ${escapeHtml(bank.code)}${bank.year ? '．' + escapeHtml(bank.year) + '年' : ''}</div>
      <h2 class="bank-card-title">${escapeHtml(bank.examName)}</h2>
      <p class="bank-card-meta">${escapeHtml(bank.level)}．${escapeHtml(bank.subject)}</p>
      <div class="bank-card-footer">
        <span class="bank-card-count">${bank.questions.length} 題</span>
        <div class="bank-card-btns">
          <button class="btn-text" data-action="start-shuffle" data-bank="${bank.id}">隨機出題</button>
          <button class="btn-primary" data-action="start" data-bank="${bank.id}">開始測驗 →</button>
        </div>
      </div>
    </article>`).join('');

  root.innerHTML = `
    <div class="app-shell">
      <header class="site-header">
        <div class="brand">
          <span class="brand-mark">目</span>
          <div><h1>題庫測驗</h1><p class="tagline">程式理解練習．Python</p></div>
        </div>
        <div class="toolbar">${themeBtn()}</div>
      </header>
      <main>
        <p class="catalog-note">目前共 ${QUESTION_BANKS.length} 個題庫，持續新增中——點選任一題庫開始作答。</p>
        <div class="catalog-grid">
          ${cards}
          <div class="bank-card bank-card-empty"><p>更多題庫<br>陸續加入中</p></div>
        </div>
      </main>
    </div>`;
}

function renderQuiz(){
  const bank = getCurrentBank();
  const qIdx = state.order[state.idx];
  const q = bank.questions[qIdx];
  const multi = isMulti(q);
  const optOrder = state.qOptOrder[qIdx];
  const answered = isAnswered(qIdx);
  const chosen = answered ? chosenPositions(qIdx) : (state.pending[qIdx] || []);
  const total = state.order.length;
  const answeredCount = state.order.filter(isAnswered).length;
  const letters = ['Ａ','Ｂ','Ｃ','Ｄ','Ｅ'];

  const optionsHtml = optOrder.map((origIdx, pos) => {
    const opt = q.options[origIdx];
    const isCorrect = answerSet(q).includes(origIdx);
    const picked = chosen.includes(pos);
    let cls = 'option' + (q.mono ? ' is-mono' : '');
    let bubble = multi ? (picked ? '■' : '□') : '◯';
    let tag = '';
    if (answered){
      if (picked){ bubble = multi ? '■' : '●'; cls += isCorrect ? ' is-correct' : ' is-incorrect'; }
      else if (isCorrect){ bubble = '✓'; cls += ' is-correct'; }
      else { cls += ' is-dim'; }
      if (isCorrect) tag = '<span class="tag">正解</span>';
      else if (picked) tag = '<span class="tag">你的答案</span>';
    } else if (picked){
      cls += ' is-picked';
    }
    return `<button class="${cls}" data-action="answer" data-pos="${pos}" ${multi && !answered ? `aria-pressed="${picked}"` : ''} ${answered?'disabled':''}>
      <span class="bubble">${bubble}</span>
      <span class="option-letter">${letters[pos]}</span>
      <span class="option-text">${escapeHtml(opt)}</span>
      ${tag}
    </button>`;
  }).join('');

  const gridCells = state.order.map((qi, pos) => {
    let cls = 'cell';
    if (pos === state.idx) cls += ' is-current';
    if (isAnswered(qi)){
      cls += isCorrectAns(bank, qi) ? ' is-correct' : ' is-incorrect';
    } else if (state.pending[qi] && state.pending[qi].length){
      cls += ' is-pending';
    }
    return `<button class="${cls}" data-action="jump" data-pos="${pos}" aria-label="第${pos+1}題">${pos+1}</button>`;
  }).join('');

  const tagParts = [];
  if (q.cat) tagParts.push(escapeHtml(q.cat));
  if (q.diff) tagParts.push('難度 ' + escapeHtml(q.diff));
  const tagsHtml = `<span class="q-tags">${multi ? '<span class="q-tag-multi">複選題</span>' : ''}${tagParts.join('．')}</span>`;

  const multiBar = (multi && !answered) ? `
        <div class="multi-bar">
          <span class="multi-hint">複選題：可選多個答案，需全部選對才算對（已選 ${chosen.length}）</span>
          <button class="btn-primary" data-action="confirm" ${chosen.length ? '' : 'disabled'}>確認答案</button>
        </div>` : '';
  const explainHtml = (answered && q.expl) ? `
        <div class="explain"><span class="explain-label">答案解析</span><p>${escapeHtml(q.expl)}</p></div>` : '';

  root.innerHTML = `
    <div class="app-shell">
      <header class="quiz-header">
        <div class="quiz-title">
          <button class="link-btn" data-action="home" style="display:block;margin-bottom:6px">← 題庫首頁</button>
          <h1>${escapeHtml(bank.subject)}</h1>
          <p class="quiz-meta">代號 ${escapeHtml(bank.code)}．第 ${state.idx+1} / ${total} 題${state.wrongOnly ? '（錯題重練）' : ''}</p>
        </div>
        <div class="toolbar">${themeBtn()}</div>
      </header>

      <div class="mode-row">
        <button class="mode-btn ${state.shuffleQ ? 'is-active' : ''}" data-action="toggle-shuffle-q" title="只重排尚未作答的題目，作答進度不會消失">${ICON_SHUFFLE}隨機出題</button>
        <button class="mode-btn ${state.shuffleO ? 'is-active' : ''}" data-action="toggle-shuffle-o" title="只打亂尚未作答題目的選項，作答進度不會消失">${ICON_LIST}選項打亂</button>
        <button class="mode-btn" data-action="restart">${ICON_RESTART}重新開始</button>
      </div>

      <div class="progress-bar"><div class="progress-fill" style="width:${total ? (answeredCount/total*100) : 0}%"></div></div>

      <main class="question-card" aria-live="polite">
        <div class="question-num">${String(state.idx+1).padStart(2,'0')}${tagsHtml}</div>
        <p class="question-text">${escapeHtml(q.q)}</p>
        ${q.code ? `<pre class="code-block"><code>${escapeHtml(q.code)}</code></pre>` : ''}
        <div class="options" role="group" aria-label="作答選項">${optionsHtml}</div>${multiBar}${explainHtml}
      </main>

      <nav class="quiz-nav">
        <button class="btn-ghost" data-action="prev" ${state.idx===0?'disabled':''}>← 上一題</button>
        <button class="link-btn" data-action="finish">查看成績</button>
        <button class="btn-ghost" data-action="next" ${state.idx===total-1?'disabled':''}>下一題 →</button>
      </nav>

      <section class="grid-nav">
        <h2>題盤導覽．已作答 ${answeredCount} / ${total}</h2>
        <div class="grid-nav-cells">${gridCells}</div>
      </section>
    </div>`;
}

function renderResults(){
  const bank = getCurrentBank();
  const total = state.order.length;
  let correct = 0;
  const wrongList = [];
  state.order.forEach(qi => {
    if (isCorrectAns(bank, qi)) correct++;
    else wrongList.push(qi);
  });
  const unanswered = state.order.filter(qi => !isAnswered(qi)).length;
  const pct = total ? Math.round(correct/total*100) : 0;
  const letters = ['Ａ','Ｂ','Ｃ','Ｄ','Ｅ'];

  const reviewHtml = wrongList.length ? `
    <section class="review">
      <h2>錯題回顧</h2>
      <ul class="review-list">
        ${wrongList.map(qi => {
          const q = bank.questions[qi];
          const optOrder = state.qOptOrder[qi];
          const picks = chosenPositions(qi);
          const userText = picks.length
            ? picks.map(p => `${letters[p]}、${escapeHtml(q.options[optOrder[p]])}`).join('；')
            : '未作答';
          let correctText;
          if (isMulti(q)){
            correctText = optOrder
              .map((oi, pos) => answerSet(q).includes(oi) ? `${letters[pos]}、${escapeHtml(q.options[oi])}` : null)
              .filter(Boolean).join('；');
          } else if (answerSet(q).length > 1){
            correctText = answerSet(q).map(oi => escapeHtml(q.options[oi])).join('　或　');
          } else {
            const correctPos = optOrder.findIndex(oi => answerSet(q).includes(oi));
            correctText = `${letters[correctPos]}、${escapeHtml(q.options[optOrder[correctPos]])}`;
          }
          return `<li>
            <p class="review-q">${String(qi+1).padStart(2,'0')}. ${escapeHtml(q.q)}</p>
            ${q.code ? `<pre class="code-block code-block-sm"><code>${escapeHtml(q.code)}</code></pre>` : ''}
            <p class="review-a">你的答案：${userText}</p>
            <p class="review-correct">正解：${correctText}</p>
            ${q.expl ? `<p class="review-expl">解析：${escapeHtml(q.expl)}</p>` : ''}
          </li>`;
        }).join('')}
      </ul>
    </section>` : `<p class="all-correct">全部答對，太厲害了！</p>`;

  const resumeCls = unanswered > 0 ? 'btn-primary' : 'btn-ghost';
  const restartCls = unanswered > 0 ? 'btn-ghost' : 'btn-primary';

  root.innerHTML = `
    <div class="app-shell">
      <header class="quiz-header">
        <div class="quiz-title">
          <button class="link-btn" data-action="home" style="display:block;margin-bottom:6px">← 題庫首頁</button>
          <h1>${escapeHtml(bank.subject)}</h1>
          <p class="quiz-meta">代號 ${escapeHtml(bank.code)}．測驗結果</p>
        </div>
        <div class="toolbar">${themeBtn()}</div>
      </header>
      <main class="results-main">
        <div class="score-stamp">
          <div class="score-stamp-ring"><span class="score-num">${correct}</span><span class="score-slash">/</span><span class="score-total">${total}</span></div>
          <p class="score-pct">答對率 ${pct}%</p>
          ${unanswered ? `<p class="score-pct">尚有 ${unanswered} 題未作答</p>` : ''}
        </div>
        <div class="results-actions">
          <button class="${resumeCls}" data-action="resume">← 回到作答進度</button>
          <button class="${restartCls}" data-action="restart">重新測驗</button>
          ${wrongList.length ? `<button class="btn-ghost" data-action="retry-wrong">只練錯題（${wrongList.length}）</button>` : ''}
          <button class="btn-ghost" data-action="home">返回題庫首頁</button>
        </div>
        ${reviewHtml}
      </main>
    </div>`;
}

function render(){
  if (state.view === 'home') renderHome();
  else if (state.view === 'quiz') renderQuiz();
  else if (state.view === 'results') renderResults();
}

/* ============ EVENTS (delegated, attached once) ============ */
root.addEventListener('click', e => {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const action = btn.dataset.action;
  if (action === 'home'){ if (confirmDiscard()) goHome(); }
  else if (action === 'start') startQuiz(btn.dataset.bank, { shuffleQ:false, shuffleO:false });
  else if (action === 'start-shuffle') startQuiz(btn.dataset.bank, { shuffleQ:true, shuffleO:false });
  else if (action === 'answer') selectOption(Number(btn.dataset.pos));
  else if (action === 'confirm') confirmMulti();
  else if (action === 'prev') goPrev();
  else if (action === 'next') goNext();
  else if (action === 'finish') finishQuiz();
  else if (action === 'resume') resumeQuiz();
  else if (action === 'jump') jumpTo(Number(btn.dataset.pos));
  else if (action === 'restart'){ if (confirmDiscard()) restartQuiz(); }
  else if (action === 'retry-wrong'){ if (confirmDiscard()) retryWrong(); }
  else if (action === 'toggle-theme') toggleTheme();
  else if (action === 'toggle-shuffle-q') toggleShuffleQ();
  else if (action === 'toggle-shuffle-o') toggleShuffleO();
});

document.addEventListener('keydown', e => {
  if (state.view !== 'quiz') return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const key = e.key.toLowerCase();
  const digitMap = {'1':0,'2':1,'3':2,'4':3,'5':4};
  const letterMap = {'a':0,'b':1,'c':2,'d':3,'e':4};
  if (key in digitMap) selectOption(digitMap[key]);
  else if (key in letterMap) selectOption(letterMap[key]);
  else if (e.key === 'Enter' && !(document.activeElement && document.activeElement.tagName === 'BUTTON')) confirmMulti();
  else if (e.key === 'ArrowRight') goNext();
  else if (e.key === 'ArrowLeft') goPrev();
});

render();
</script>
</body>
</html>
